version: '3.8'

services:
  # 1. Main Invera Application (FastAPI BE + built FE)
  web:
    build:
      context: ..
      dockerfile: docker_config/Dockerfile
    container_name: invera-app
    restart: always
    # Read environment variables directly from BE/.env
    env_file:
      - ../BE/.env
    environment:
      # Override database host to point to our local db container
      # Comment this out if you are using an external/Tailscale database (e.g. 100.82.138.69)
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=cloud
      - PG_PASSWORD=cloud_pass
      - PG_DBNAME=invera_prod
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=9000
    volumes:
      - invera-uploads:/app/uploads
      - invera-private-uploads:/app/private_uploads
    ports:
      - "9000:9000"
    depends_on:
      - db

  # 2. Local PostgreSQL Database Container
  # (Optional: Only used if not connecting to an external database)
  db:
    image: postgres:15-alpine
    container_name: invera-db
    restart: always
    environment:
      - POSTGRES_USER=cloud
      - POSTGRES_PASSWORD=cloud_pass
      - POSTGRES_DB=invera_prod
    volumes:
      - invera-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 3. Cloudflare Tunnel Container
  # Connects the local app securely to the public domain invera.pp.ua
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: invera-tunnel
    restart: always
    # Replace the placeholder or env variable with your Cloudflare Tunnel token
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:-your-tunnel-token-here}
    depends_on:
      - web

volumes:
  invera-db-data:
  invera-uploads:
  invera-private-uploads:
